  alert('【屏幕诊断】把这段发给我\n'
    + 'innerHeight: ' + window.innerHeight + '\n'
    + 'visualViewport: ' + (window.visualViewport ? Math.round(window.visualViewport.height) : '不支持') + '\n'
    + 'screen.height: ' + (window.screen ? window.screen.height : '?') + '\n'
    + 'body 实际高度: ' + Math.round(document.body.getBoundingClientRect().height) + '\n'
    + '顶栏距屏幕顶: ' + (bar ? Math.round(bar.getBoundingClientRect().top) : '?') + '\n'
    + '安全区 上/下: ' + insetTop + ' / ' + insetBottom + '\n'
    + '独立窗口模式: ' + (standalone ? '是' : '否') + '\n'
    + '设备像素比: ' + window.devicePixelRatio);
});

/* 自动快照：手动触发一次留档（清空、恢复之前用） */
function pushSnapshot(){
  try{
    var l = readSnapshots();
    l.push({ at: Date.now(), todos: db.todos, log: db.log });
    if(l.length > SNAP_MAX) l = l.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(l));
  }catch(e){}
}
/* 快照列表渲染：用「时间戳」而不是数组下标做标识 ——
   下标在 pushSnapshot 挤掉最老一份之后会整体错位，点第 1 条会恢复成另一份。 */
function renderSnapList(){
  var list = readSnapshots();
  var box  = document.getElementById('snapBox');
  if(!list.length){
    document.getElementById('snapList').innerHTML =
      '<div class="empty-stat">还没有快照。<br>每天第一次打开应用会自动留一份，最多保留 3 份。</div>';
  }else{
    document.getElementById('snapList').innerHTML = list.map(function(s){
      var d = new Date(s.at);
      var n = (s.todos || []).filter(function(t){ return !t.deleted; }).length;
      return '<div class="snap">'
           + '<div class="t">' + d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate()
           +   ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + '</div>'
           + '<div class="d">' + n + ' 条待办 · ' + ((s.log || []).length) + ' 条历史记录</div>'
           + '<button data-snap-at="' + s.at + '">恢复这一份</button></div>';
    }).reverse().join('');
  }
  return box;
}
document.getElementById('btnSnapshots').addEventListener('click', function(){
  renderSnapList().classList.toggle('hidden');
});
document.getElementById('snapBox').addEventListener('click', function(ev){
  var b = ev.target.closest('[data-snap-at]');
  if(!b) return;
  var at = parseInt(b.getAttribute('data-snap-at'), 10);
  var s = readSnapshots().filter(function(x){ return x.at === at; })[0];
  if(!s) return;
  if(!confirm('将把数据恢复到这份快照的状态。当前数据会先自动存一份，可以再恢复回来。继续？')) return;
  pushSnapshot();                       // 留一颗后悔药
  db = normalizeImport({ version:2, todos: s.todos || [], log: s.log || [] });
  save(); migrate(); settle(); render();
  document.getElementById('screenMenu').classList.add('hidden');
  renderSnapList();                     // 环里的内容已经变了，重绘避免列表与下标错位
  var d = new Date(s.at);
  showToast('已恢复到 ' + (d.getMonth()+1) + '/' + d.getDate() + ' 的快照');
});
document.getElementById('btnClear').addEventListener('click', function(){
  if(!confirm('将删除全部待办和统计数据。确定？')) return;
  pushSnapshot();                       // 清空前留一份
  db = { version:2, todos:[], log:[] };
  save(); render();
  document.getElementById('screenMenu').classList.add('hidden');
  showToast('已清空（清空前存了快照，可从「从自动快照恢复」找回）');
});

/* ============ 视口高度 ============ */
/* 部分手机浏览器对 100vh / 100dvh 的处理有偏差，用实测值兜住，
   让页面正好铺满屏幕。键盘弹出时 innerHeight 会变小，加下限避免布局被压扁。 */
function setAppHeight(){
  var h = window.innerHeight || 0;
  if(!h) return;
  var floor = (window.screen && window.screen.height ? window.screen.height : h) * 0.6;
  if(h < floor) return;
  document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 150); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

/* ============ 启动 ============ */
load();
migrate();
settle();
snapshot();               // 每天首次打开留一份快照
render();
switchTab('home');

document.addEventListener('visibilitychange', function(){
  /* 从后台切回时也补一次快照：iOS 从主屏图标恢复页面通常不会重新 load，
     只靠启动那一次的话，「每天一份」会退化成「每次冷启动一份」。 */
  if(!document.hidden){ snapshot(); if(settle()) render(); }
});
setInterval(function(){ if(settle()) render(); }, 60000);

})();

/* 注册 Service Worker：实现「断网也能打开」。
   只在 http/https 下注册；用本地文件（file://）打开时跳过。 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function(){});
  });
}
</script>
