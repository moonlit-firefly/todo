<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="佳木待办">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>佳木的待办助手</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#e4e4e9;
  --accent:#0a84ff; --danger:#ff3b30;
  --q0:#ff3b30; --q1:#ff9500; --q2:#34c759; --q3:#a1a1a6;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989d;--line:#2c2c2e;--q3:#8e8e93;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;
  height:100vh;
  height:100dvh;
  height:var(--app-h,100dvh);   /* JS 实测优先，兜底 dvh，再兜底 vh */
  overflow:hidden;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hidden{display:none!important}
input,textarea{font:inherit;color:var(--text)}

/* ---------- 顶栏 ---------- */
/* 顶部不再叠加 safe-area：独立窗口下系统已为状态栏预留空间，
   再叠一次就会出现一条空白带。底部仍保留，避免被手势条压住。 */
.topbar{display:flex;align-items:center;padding:10px 14px 5px}
.topbar h1{font-size:20px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:50%;font-size:19px;color:var(--muted);display:grid;place-items:center}
.iconbtn:active{background:var(--line)}
#btnRecurAdd{color:var(--accent);font-size:24px;font-weight:300}

/* ---------- 页面 ---------- */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scrollarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}

/* 分段控件 */
.seg{display:flex;gap:3px;margin:2px 14px 10px;background:var(--line);border-radius:9px;padding:3px;flex:none}
.seg button{flex:1;padding:7px 0;border-radius:7px;font-size:14px;opacity:.62}
.seg button.on{background:var(--card);opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- 四象限网格 ---------- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:0 10px}
.q{background:var(--card);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.q-head{display:flex;align-items:center;gap:5px;padding:8px 8px 6px;border-bottom:1px solid var(--line);flex:none}
.q-dot{width:7px;height:7px;border-radius:50%;flex:none}
.q-title{font-size:12px;font-weight:650;flex:1;line-height:1.15;letter-spacing:-.1px}
.q-count{font-size:11px;color:var(--muted);font-weight:400}
.q-add{font-size:21px;line-height:1;color:var(--accent);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:300}
.q-add:active{background:var(--line)}
.q-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1px 0}
.q-foot{padding:6px 8px;font-size:12px;color:var(--accent);border-top:1px solid var(--line);text-align:center;flex:none}
.q-empty{padding:14px 10px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}

/* ---------- 待办条目 ---------- */
.item{display:flex;align-items:flex-start;gap:7px;padding:7px 8px 7px 8px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--line)}
.check{width:19px;height:19px;border-radius:50%;border:1.8px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;transition:background .12s,border-color .12s}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.item.done .check::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .body{flex:1;min-width:0}
.item .txt{font-size:13.5px;line-height:1.35;word-break:break-word}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.item .meta .over{color:var(--danger)}
.item .meta .soon{color:var(--q1)}
.item .meta .auto{color:var(--q1);font-weight:600}

/* ---------- 周期待办列表 ---------- */
.rlist{background:var(--card);border-radius:var(--r);margin:0 14px;overflow:hidden}
.rlist .item{padding:11px 12px}
.rlist .item .txt{font-size:15px}
.rlist .check{width:21px;height:21px;margin-top:2px}
.r-empty{padding:54px 30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9}
.r-empty .big{font-size:32px;margin-bottom:10px}
.r-empty b{color:var(--text);font-weight:600}

/* ---------- 数据统计 ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 14px 12px}
.tile{background:var(--card);border-radius:var(--r);padding:11px 10px;text-align:center}
.tile .v{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .k{font-size:11px;color:var(--muted);margin-top:3px}
.tile.warn .v{color:var(--danger)}
.card{background:var(--card);border-radius:var(--r);margin:0 14px 12px;padding:14px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:650;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card h3 .sub{font-size:11.5px;color:var(--muted);font-weight:400}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12.5px}
.hbar:last-child{margin-bottom:0}
.hbar .lb{width:78px;flex:none;color:var(--muted);font-size:11.5px}
.hbar .track{flex:1;height:15px;background:var(--bg);border-radius:8px;overflow:hidden}
/* display:block 不能省：.fill 是 .track 里的 span，不是 flex item，
   行内元素会忽略 width/height，进度条会整条空掉（只留灰色槽）。 */
.hbar .fill{display:block;height:100%;border-radius:8px}
.hbar .num{width:62px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}

/* ---------- 事件 ---------- */
.ev-item{display:flex;align-items:center;gap:12px}
.ev-main{flex:1;min-width:0}
.ev-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-sub{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-count{flex:none;text-align:center;min-width:46px}
.ev-count b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.ev-count span{font-size:10.5px;color:var(--muted)}
.ev-plus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:23px;font-weight:300;line-height:1;display:grid;place-items:center}
.ev-plus:active{opacity:.7}
.ev-today{color:var(--accent);font-weight:600}
.hours{display:flex;align-items:flex-end;gap:2px;height:66px}
.hours div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
.rstab{font-size:12.5px;margin-bottom:13px}
.rstab:last-child{margin-bottom:0}
.rstab .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}
.rstab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstab .pct{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty-stat{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 0;line-height:1.8}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:10px}
.sec-title{font-size:12.5px;font-weight:700;color:var(--muted);margin:20px 14px 10px;letter-spacing:.6px}
.sec-title:first-child{margin-top:4px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px}
.hcell{aspect-ratio:1;border-radius:3px;display:block}

/* ---------- 底部标签栏 ---------- */
.tabbar{display:flex;flex:none;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;padding:9px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:17px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:600}

/* ---------- 整屏详情 ---------- */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.screen-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line)}
.screen-head h2{margin:0;font-size:17px;flex:1;font-weight:650}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.back{color:var(--accent);font-size:16px;display:flex;align-items:center;gap:2px;padding:4px 6px 4px 0}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{margin:0 0 14px;font-size:17px;font-weight:650}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field textarea,.field input[type=date],.field input[type=datetime-local],.field input[type=number]{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;outline:none
}
@media (prefers-color-scheme:dark){.field textarea,.field input[type=date],.field input[type=datetime-local],.field input[type=number]{background:#2c2c2e}}
.field textarea{resize:none;min-height:76px;line-height:1.5}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap}
.chip{flex:1;padding:11px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center}
@media (prefers-color-scheme:dark){.chip{background:#2c2c2e}}
.chips.wrap .chip{flex:1 1 46%;padding:10px 4px;font-size:13.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.on.warn{background:var(--q0);border-color:var(--q0)}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px 0;border-radius:11px;font-size:15.5px;text-align:center;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
@media (prefers-color-scheme:dark){.btn.ghost{background:#2c2c2e}}
.btn.danger{background:transparent;color:var(--danger)}
.btn:active{opacity:.75}

/* ---------- 菜单 ---------- */
.menu-list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 14px}
.menu-list button{display:block;width:100%;text-align:left;padding:15px 16px;font-size:15.5px;border-bottom:1px solid var(--line)}
.menu-list button:last-child{border-bottom:0}
.menu-list button.danger{color:var(--danger)}
.menu-list button:active{background:var(--line)}
.warnbar{background:#ff950022;color:#c86a00;font-size:12.5px;padding:9px 14px;text-align:center;line-height:1.6}
@media (prefers-color-scheme:dark){.warnbar{color:#ffb340}}
.warnbar button{color:inherit;text-decoration:underline;font-weight:700;font-size:12.5px;margin-left:4px}
.warnbar.danger{background:#ff3b3022;color:#d70015}
@media (prefers-color-scheme:dark){.warnbar.danger{color:#ff6961}}
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:200;
  background:#1c1c1e;color:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;
  font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){.toast{background:#2c2c2e}}
.toast .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{color:#0a84ff;font-weight:600;font-size:14px;flex:none}

/* ---------- 确认弹窗 ---------- */
.cfm-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;display:flex;align-items:center;justify-content:center;padding:0 28px}
.cfm{background:var(--card);border-radius:15px;width:100%;max-width:340px;overflow:hidden;text-align:center}
.cfm h3{margin:0;padding:19px 18px 4px;font-size:16.5px;font-weight:650}
.cfm p{margin:0;padding:0 18px 17px;font-size:13px;color:var(--muted);line-height:1.6}
.cfm-row{display:flex;border-top:1px solid var(--line)}
.cfm-row button{flex:1;padding:13px 0;font-size:16px;color:var(--accent)}
.cfm-row button + button{border-left:1px solid var(--line)}
.cfm-row button.danger{color:var(--danger);font-weight:600}
.snap{margin-bottom:10px;padding:12px 14px;background:var(--bg);border-radius:10px}
.snap .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.snap .d{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.snap button{font-size:13px;color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="pageTitle">佳木的待办助手</h1>
  <button class="iconbtn hidden" id="btnRecurAdd" aria-label="新建周期待办">＋</button>
  <button class="iconbtn hidden" id="btnEventAdd" aria-label="新建事件">＋</button>
  <button class="iconbtn" id="btnMenu" aria-label="数据管理">⋯</button>
</div>

<div id="storeWarn" class="warnbar hidden"></div>
<div id="corruptWarn" class="warnbar danger hidden"></div>

<!-- ========== 主页 ========== -->
<div class="page" id="page-home">
  <div class="seg" id="segHome">
    <button data-sub="pending" class="on">待完成</button>
    <button data-sub="done">已完成</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ========== 周期待办 ========== -->
<div class="page hidden" id="page-recur">
  <div class="seg" id="segRecur">
    <button data-rtype="daily" class="on">日度</button>
    <button data-rtype="interval">周期</button>
    <button data-rtype="someday">长期</button>
  </div>
  <div class="scrollarea" id="recurScroll">
    <div class="rlist" id="recurList"></div>
    <div class="r-empty hidden" id="recurEmpty"></div>
  </div>
</div>

<!-- ========== 数据统计 ========== -->
<div class="page hidden" id="page-stats">
  <div class="seg" id="segRange">
    <button data-days="7" class="on">近 7 天</button>
    <button data-days="30">近 30 天</button>
    <button data-days="90">近 90 天</button>
  </div>
  <div class="seg" id="segStats">
    <button data-stats="quad" class="on">四象限</button>
    <button data-stats="habit">习惯</button>
    <button data-stats="event">事件</button>
  </div>
  <div class="scrollarea" id="statsBody"></div>
</div>

<!-- ========== 事件 ========== -->
<div class="page hidden" id="page-event">
  <div class="scrollarea" id="eventScroll">
    <div class="rlist" id="eventList"></div>
    <div class="r-empty hidden" id="eventEmpty"></div>
  </div>
</div>

<!-- ========== 数据管理菜单 ========== -->
<div class="screen hidden" id="screenMenu">
  <div class="screen-head">
    <button class="back" data-close="screenMenu">‹ 返回</button>
    <h2>数据管理</h2>
  </div>
  <div class="screen-body" style="padding-top:14px">
    <div class="menu-list">
      <button id="btnExport">导出备份（JSON）</button>
      <button id="btnImport">导入备份（JSON）</button>
      <button id="btnCopy">复制备份到剪贴板</button>
      <button id="btnSnapshots">从自动快照恢复</button>
      <button id="btnDiag">显示屏幕诊断信息</button>
      <button class="danger" id="btnClear">清空全部数据</button>
    </div>
    <div id="snapBox" class="hidden" style="padding:14px">
      <div id="snapList"></div>
    </div>
    <p style="padding:16px 18px;font-size:12.5px;color:var(--muted);line-height:1.7">
      数据只保存在这台设备的浏览器里，不上传任何服务器。<br>
      每天第一次打开会自动留一份快照（保留最近 3 份），误删或数据异常时可从这里恢复。<br>
      <b>仍建议每周导出一次备份</b>——清理浏览器缓存或卸载时，本地数据会一并消失。
    </p>
  </div>
</div>

<!-- ========== 象限详情 ========== -->
<div class="screen hidden" id="screenQuad">
  <div class="screen-head">
    <button class="back" data-close="screenQuad">‹ 返回</button>
    <h2 id="quadTitle">象限</h2>
    <button class="iconbtn" id="quadAdd" style="color:var(--accent)" aria-label="新建待办">＋</button>
  </div>
  <div class="screen-body" id="quadBody"></div>
</div>

<!-- ========== 编辑弹层 ========== -->
<div class="mask hidden" id="maskEdit">
  <div class="sheet" id="sheetEdit">
    <div class="sheet-grip"></div>
    <h2 id="editTitle">新建待办</h2>

    <div class="field">
      <label>待办内容</label>
      <textarea id="fContent" placeholder="要做什么？"></textarea>
    </div>

    <div class="field">
      <label>重复方式</label>
      <div class="chips wrap" id="recurChips">
        <div class="chip on" data-r="none">不重复</div>
        <div class="chip" data-r="daily">每天刷新</div>
        <div class="chip" data-r="interval">每 N 天刷新</div>
        <div class="chip" data-r="someday">长期（以后再做）</div>
      </div>
    </div>

    <div class="field hidden" id="intervalField">
      <label>每隔多少天刷新为未完成</label>
      <input type="number" id="fInterval" min="1" max="365" value="3" inputmode="numeric">
    </div>

    <div class="field" id="impUrgField">
      <label>属性（决定它属于哪个象限）</label>
      <div class="chips">
        <div class="chip" id="chipImp">重要</div>
        <div class="chip warn" id="chipUrg">紧急</div>
      </div>
      <div class="hint hidden" id="autoUrgHint" style="margin-top:8px">
        ⚡ 距离截止不足 24 小时，保存后会<b>自动按「紧急」处理</b>，出现在左上象限。把截止时间改远就会自动恢复。
      </div>
    </div>

    <div class="field">
      <label>截止日期（可留空，可精确到分钟）</label>
      <input type="datetime-local" id="fDue">
    </div>

    <div class="field">
      <label>提醒时间（可留空，暂不触发通知）</label>
      <input type="datetime-local" id="fRemind">
    </div>

    <div class="sheet-actions">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
    <div class="sheet-actions hidden" id="editDeleteRow">
      <button class="btn danger" id="btnDelete">删除这条待办</button>
    </div>
  </div>
</div>

<!-- ========== 事件编辑弹层 ========== -->
<div class="mask hidden" id="maskEvent">
  <div class="sheet" id="sheetEvent">
    <div class="sheet-grip"></div>
    <h2 id="eventEditTitle">新建事件</h2>

    <div class="field">
      <label>事件名称</label>
      <textarea id="fEventName" placeholder="要记录的事情？例如「游泳」「跑步」"></textarea>
    </div>
    <div class="hint" style="margin:-6px 0 14px">
      事件不追求「完成」，只累计次数：每点一次 <b>＋</b> 记 1 次，并自动记下发生时间。
    </div>

    <div class="sheet-actions">
      <button class="btn ghost" id="btnEventCancel">取消</button>
      <button class="btn primary" id="btnEventSave">保存</button>
    </div>
    <div class="sheet-actions hidden" id="eventDeleteRow">
      <button class="btn danger" id="btnEventDelete">删除这个事件</button>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept=".json,application/json" class="hidden">

<!-- ========== 底部标签栏 ========== -->
<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on"><span class="ic">☑</span>主页</button>
  <button data-tab="recur"><span class="ic">🔄</span>周期待办</button>

<div id="toast" class="toast hidden"><span class="msg" id="toastMsg"></span><button id="toastAct" class="hidden">撤销</button></div>

<!-- 通用确认弹窗（比 confirm 更适合移动端，能显示两行说明） -->
<div id="cfmMask" class="cfm-mask hidden">
  <div class="cfm">
    <h3 id="cfmTitle"></h3>
    <p id="cfmText"></p>
    <div class="cfm-row">
      <button id="cfmNo">取消</button>
      <button id="cfmYes" class="danger">确定</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============ 常量 ============ */
var KEY = 'dsh.todo.v2';
var OLD_KEY = 'dsh.todo.v1';
var CORRUPT_KEY = 'dsh.todo.corrupt';
var SNAP_KEY = 'dsh.todo.snapshots';
var SNAP_META = 'dsh.todo.snapmeta';
var SNAP_MAX = 3;
var SHOW_MAX = 3;
var DAY = 86400000;
var DAY_OFFSET = 4 * 3600000;   // 「一天」从凌晨 4 点算起
var QCOLORS = ['#ff3b30','#ff9500','#34c759','#a1a1a6'];
var LOG_MAX = 6000;

var QUADS = [
  {name:'重要且紧急',   dot:'var(--q0)', imp:true,  urg:true },
  {name:'不重要但紧急', dot:'var(--q1)', imp:false, urg:true },
  {name:'重要不紧急',   dot:'var(--q2)', imp:true,  urg:false},
  {name:'不重要不紧急', dot:'var(--q3)', imp:false, urg:false}
];
var SHORT_Q = ['重要紧急','不重要紧急','重要不紧急','不重要不紧急'];

var RTYPES = {
  daily:   {label:'日度待办', empty:'还没有日度待办', tip:'每天<b>凌晨 4 点</b>后自动刷新为未完成。<br>凌晨 4 点之前算前一天，熬夜到两三点打卡也算当天。<br>比如「每天喝水 2L」「每天读 30 分钟」'},
  interval:{label:'周期待办', empty:'还没有周期待办', tip:'按你设定的天数，在<b>凌晨 4 点</b>刷新。<br>比如「每 3 天浇花」「每 7 天复盘」'},
  someday: {label:'长期待办', empty:'还没有长期待办', tip:'想做、但当下不方便或还不合适的事。<br>以后有机会再做，或当作一个长期的方向。'}
};

/* ============ 状态 ============ */
/* events 从 v10 起存在；老数据可能只有 todos/log，读时补空表 */
var db = { version:2, todos:[], log:[], events:[], eventsSeeded:false };
var ui = { tab:'home', sub:'pending', quad:null, rtype:'daily', days:7, stats:'quad' };
var storageOK = true;
var editingId = null;
var editingEventId = null;
var draft = { imp:true, urg:true, recur:'none', intervalDays:3 };

/* ============ 存储 ============ */
var corruptRaw = null;      // 读取失败时保留的原始内容（绝不静默丢弃）
var saveFailed = false;

function warn(msg, danger){
  var el = document.getElementById('storeWarn');
  el.className = 'warnbar' + (danger ? ' danger' : '');
  el.innerHTML = msg;
}
/* warnCorrupt 的文案与事实保持一致：原文写进了 CORRUPT_KEY，
   刷新后 load() 会从这里重新挂出横幅，所以「下载原始数据」不会丢。 */
function warnCorrupt(){
  var el = document.getElementById('corruptWarn');
  el.innerHTML = '⚠️ 数据读取失败，原始内容已保留，没有被覆盖。'
               + '<button id="btnCorrupt">下载原始数据</button>'
               + '<button id="btnCorruptClear">我知道了</button>';
  el.classList.remove('hidden');
  document.getElementById('btnCorrupt').onclick = function(){
    download('佳木待办-损坏数据-'+toDateInput(Date.now())+'.txt', corruptRaw || '', 'text/plain');
  };
  document.getElementById('btnCorruptClear').onclick = function(){
    try{ localStorage.removeItem(CORRUPT_KEY); }catch(e){}
    el.classList.add('hidden');
  };
}

var loadFailed = false;      // 本次是否因数据损坏而空表启动（决定能不能写快照）

function load(){
  var raw = null, fromOld = false, parseFailed = false;

  /* 第一步：只判断「能不能读」。存储不可用 ≠ 内容损坏，两者必须分开 */
  try{
    raw = localStorage.getItem(KEY);
    if(!raw){ raw = localStorage.getItem(OLD_KEY); fromOld = !!raw; }
  }catch(e){ storageOK = false; }

  if(!storageOK){
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storageOK = true; }
    catch(e){ storageOK = false; }
    if(!storageOK) warn('⚠️ 本浏览器不允许本地存储，数据在关闭页面后会丢失。请定期导出备份。', true);
  }

  /* 第二步：解析。失败时保留原文，绝不静默清空 */
  if(raw){
    try{
      var o = JSON.parse(raw);
      if(o && Array.isArray(o.todos)) db = o;
      else parseFailed = true;
    }catch(e){ parseFailed = true; }

    if(parseFailed){
      corruptRaw = raw;
      loadFailed = true;
      try{ localStorage.setItem(CORRUPT_KEY, raw); }catch(e){}
      warnCorrupt();
    }else if(fromOld){
      save();                                       // 迁移到新键
      try{ localStorage.removeItem(OLD_KEY); }catch(e){}
    }
  }

  /* 第三步：上次会话留下的「损坏原文」如果还在，刷新后要把横幅和下载入口
     重新挂出来。否则 save() 第一次覆写 KEY 之后，用户就再也拿不回原文了。 */
  if(!parseFailed && !corruptRaw){
    try{
      var kept = localStorage.getItem(CORRUPT_KEY);
      if(kept){ corruptRaw = kept; warnCorrupt(); }
    }catch(e){}
  }

  if(!db.log) db.log = [];
  if(!Array.isArray(db.events)) db.events = [];
}

function save(){
  if(!storageOK) return;
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    saveFailed = false;
  }catch(e){
    if(!saveFailed){
      saveFailed = true;
      warn('⚠️ 保存失败，浏览器存储空间可能已满。<b>请立即导出备份</b>，否则新数据会丢。', true);
    }
  }
}

/* 每天首次打开留一份快照，最多 3 份。
   顺序很重要：先写主数据（save 已在前），再写快照，空间不足时牺牲快照而不是主数据。 */
function snapshot(){
  /* 因数据损坏而空表启动时绝不写快照：否则今天这份「空数据」会挤掉
     快照环里最老的一份真快照，等于用损坏换掉了用户的备份。 */
  if(!storageOK || saveFailed || loadFailed) return;
  try{
    var today = dayStart(Date.now());
    if(localStorage.getItem(SNAP_META) === String(today)) return;
    var list = readSnapshots();
    list.push({ at: Date.now(), todos: db.todos, log: db.log });
    if(list.length > SNAP_MAX) list = list.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(list));
    localStorage.setItem(SNAP_META, String(today));
  }catch(e){ /* 空间不足就跳过，主数据已经安全 */ }
}
function readSnapshots(){
  try{
    var v = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}

/* id 会被拼进 HTML 属性、也会参与查找比较，所以必须是「安全形状」。
   只在导入处清理不够 —— localStorage 里的老数据同样要过这一关。
   非字符串、含可疑字符、或重复的，一律换成新 id，并返回新旧对照表。 */
function normalizeIds(todos, log, filter){
  var map = {}, seen = {};
  (todos || []).forEach(function(t){
    if(!t) return;
    var raw = (typeof t.id === 'string' || typeof t.id === 'number') ? String(t.id) : '';
    if(raw && /^[A-Za-z0-9_-]{1,64}$/.test(raw) && !seen[raw]){
      seen[raw] = 1;
      if(raw !== t.id) t.id = raw;          // 数字 id 统一成字符串
    }else{
      if(raw) map[raw] = null;              // 占位，下面统一分配
      t.id = uid();
      seen[t.id] = 1;
      if(raw) map[raw] = t.id;
    }
  });
  if(log && log.length){
    log.forEach(function(e){
      if(!e || !map[e.id]) return;
      if(filter && !filter(e)) return;      // 只改本类条目的引用
      e.id = map[e.id];
    });
  }
  return map;
}

/* 导入前做一次轻量校验与归一化，避免脏数据把界面搞崩 */
function normalizeImport(o){
  if(!o || !Array.isArray(o.todos)) throw new Error('缺少 todos 数组 —— 可能不是本应用的备份文件');
  var out = {
    version: 2,
    todos: [],
    log: Array.isArray(o.log) ? o.log.filter(function(e){
      return e && typeof e === 'object' && e.type && typeof e.id === 'string' && typeof e.at === 'number';
    }) : []
  };
  o.todos.forEach(function(t){
    if(!t || typeof t !== 'object' || typeof t.content !== 'string') return;
    var rec = (t.recurring === 'daily' || t.recurring === 'interval' || t.recurring === 'someday')
      ? t.recurring : null;
    out.todos.push({
      id: t.id,
      content: t.content,
      createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now(),
      dueAt: typeof t.dueAt === 'number' ? t.dueAt : null,
      remindAt: typeof t.remindAt === 'number' ? t.remindAt : null,
      done: !!t.done,
      doneAt: typeof t.doneAt === 'number' ? t.doneAt : null,
      important: !!t.important,
      urgent: !!t.urgent,
      deleted: !!t.deleted,
      recurring: rec,
      intervalDays: typeof t.intervalDays === 'number' ? t.intervalDays : null,
      lastResetAt: typeof t.lastResetAt === 'number' ? t.lastResetAt : null,
      doneCount: typeof t.doneCount === 'number' ? t.doneCount : null,
      lastDoneDay: typeof t.lastDoneDay === 'number' ? t.lastDoneDay : null
    });
  });
  /* id 统一在这里规范化：非法或重复的换新 id，日志里的引用同步改写，
     否则习惯的完成记录会全部对不上。 */
  normalizeIds(out.todos, out.log);
  /* 事件表：导入旧备份（那时还没有事件功能）时为 undefined，补空表 */
  out.events = [];
  out.eventsSeeded = true;      // 导入的备份已定型，不再补默认「游泳」
  (Array.isArray(o.events) ? o.events : []).forEach(function(e){
    if(!e || typeof e !== 'object') return;
    var nm = (typeof e.name === 'string' && e.name.trim()) ? e.name.trim().slice(0, 40) : null;
    if(!nm) return;
    out.events.push({
      id: e.id,
      name: nm,
      createdAt: typeof e.createdAt === 'number' ? e.createdAt : Date.now(),
      deleted: !!e.deleted,
      count: (typeof e.count === 'number' && e.count >= 0) ? Math.floor(e.count) : 0
    });
  });
  normalizeIds(out.events, out.log);
  return out;
}

/* ============ 事件：计数式记录 ============ */
/* 与「事项」「习惯」并列的第三类：不追求完成，只累计次数。
   每点一次加号 = 计数 +1，并在日志里追加一条 bump 记录（含精确时间）。 */
function activeEvents(){
  return (db.events || []).filter(function(e){ return e && !e.deleted; });
}
function findEvent(id){
  return (db.events || []).filter(function(e){ return e && e.id === id; })[0];
}
function logBump(e, at){
  if(!db.log) db.log = [];
  db.log.push({ at: at || Date.now(), type: 'bump', id: e.id, recur: null });
  if(db.log.length > LOG_MAX) db.log = db.log.slice(-Math.round(LOG_MAX * 0.8));
}
function bumpEvent(id){
  var e = findEvent(id);
  if(!e) return;
  var now = Date.now();
  e.count = (typeof e.count === 'number' ? e.count : 0) + 1;
  e.lastAt = now;
  logBump(e, now);
  save();
  renderEvents();
  showToast('「' + e.name + '」已记为第 ' + e.count + ' 次', '撤销', function(){
    e.count = Math.max(0, e.count - 1);
    /* 撤销时把刚写进去的那条 bump 摘掉，保持日志与计数一致 */
    for(var i = db.log.length - 1; i >= 0; i--){
      if(db.log[i].type === 'bump' && db.log[i].id === e.id){ db.log.splice(i, 1); break; }
    }
    save(); renderEvents();
  });
}

/* 下载文本为文件 */
function download(filename, text, mime){
  var blob = new Blob([text], { type: mime || 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ============ 事件日志 ============ */
/* 只追加、不修改。周期待办刷新时会清空 doneAt，
   没有这份日志就无法做任何时间维度的统计。 */
function logEvent(type, t){
  if(!db.log) db.log = [];
  var rec = (t.recurring && t.recurring !== 'none') ? t.recurring : null;
  // 周期待办不属于四象限，q 记 null，避免污染象限统计
  db.log.push({ at: Date.now(), type: type, id: t.id, q: rec ? null : quadOf(t), recur: rec });
  if(db.log.length > LOG_MAX) db.log = db.log.slice(-Math.round(LOG_MAX * 0.8));
}
/* 数据升级（每次启动都跑，幂等） */
function migrate(){
  var changed = false;
  db.log = db.log || [];

  /* 0) id 规范化：localStorage 里的老数据、手改过的备份都可能带非法 id。
     id 会拼进 HTML 属性，必须先过这一关，再谈别的迁移。 */
  var beforeIds = db.todos.map(function(t){ return t && t.id; }).join('\u0001');
  normalizeIds(db.todos, db.log, function(e){ return !e.recur; });   // 周期事件的 id 来自习惯表，不在此列
  if(db.todos.map(function(t){ return t && t.id; }).join('\u0001') !== beforeIds) changed = true;

  /* 0b) 事件表：同样先规范 id，再补默认事件 */
  if(!Array.isArray(db.events)){ db.events = []; changed = true; }
  var beforeEv = db.events.map(function(e){ return e && e.id; }).join('\u0001');
  normalizeIds(db.events, db.log);
  if(db.events.map(function(e){ return e && e.id; }).join('\u0001') !== beforeEv) changed = true;
  if(!db.eventsSeeded){
    /* 只在第一次给默认事件。用户删掉「游泳」后不会再自己冒出来 */
    if(!db.events.length){
      db.events.push({ id: uid(), name: '游泳', createdAt: Date.now(), deleted: false, count: 0 });
    }
    db.eventsSeeded = true;
    changed = true;
  }

  /* 1) v1 -> v2：从现有待办补一份初始日志 */
  if(db.version < 2){
    db.todos.forEach(function(t){
      var rec = (t.recurring && t.recurring !== 'none') ? t.recurring : null;
      var q = rec ? null : quadOf(t);
      if(t.createdAt) db.log.push({ at:t.createdAt, type:'create', id:t.id, q:q, recur:rec });
      if(t.done && t.doneAt) db.log.push({ at:t.doneAt, type:'done', id:t.id, q:q, recur:rec });
    });
    db.log.sort(function(a,b){ return a.at - b.at; });
    db.version = 2;
    changed = true;
  }

  /* 2) 补 doneCount：完成次数必须独立于日志存在，
        否则日志被裁剪时会永久拉低历史完成率 */
  db.todos.forEach(function(t){
    if(t.doneCount != null) return;
    var days = {};
    db.log.forEach(function(e){
      if(e.id === t.id && e.type === 'done') days[dayStart(e.at)] = 1;
    });
    var keys = Object.keys(days).map(Number).sort(function(a,b){ return b - a; });
    t.doneCount = keys.length;
    t.lastDoneDay = keys.length ? keys[0] : null;
    changed = true;
  });

  if(changed) save();
}

/* ============ 工具 ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* 周期天数统一在这里夹紧 1..365。
   只在编辑器里夹不够 —— 导入的数据可能带超大值，会让「每 N 天」形同不刷新。 */
function intervalOf(t){
  return Math.max(1, Math.min(365, parseInt(t.intervalDays, 10) || 1));
}

/* 是否已逾期：唯一口径 —— 精确截止时刻已过。
   这里必须是唯一的判定入口：条目行的红字、统计页的「已逾期」tile、逾期率
   全部调它，否则会出现「条目说逾期、统计说 0」的自相矛盾。 */
function isOverdue(t){
  return !t.done && !!t.dueAt && !isRecur(t) && t.dueAt < Date.now();
}

/* 距截止不足 24 小时 → 自动按「紧急」处理。
   到期日当天（凌晨 4 点起）即满足，等价于「今天到期就变紧急」。
   这是派生判断、不改数据 —— 把截止日期改远就会自动恢复。 */
function autoUrgent(t){
  if(t.done || !t.dueAt || isRecur(t)) return false;
  return (t.dueAt - Date.now()) <= DAY;
}
function isUrgentNow(t){
  return !!t.urgent || autoUrgent(t);
}
/* 用户自己没勾紧急、却被自动提上来的（只在界面上做提示用） */
function autoUpgraded(t){
  return !t.urgent && autoUrgent(t);
}
function quadOf(t){
  var urg = isUrgentNow(t);
  if(t.important && urg) return 0;
  if(!t.important && urg) return 1;
  if(t.important && !urg) return 2;
  return 3;
}
function active(){ return db.todos.filter(function(t){ return !t.deleted; }); }
function isRecur(t){ return !!t.recurring && t.recurring !== 'none'; }
function inQuad(q, done){
  return active().filter(function(t){ return !isRecur(t) && quadOf(t)===q && !!t.done===done; });
}
function inRecur(type){
  return active().filter(function(t){ return t.recurring === type; });
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* 「一天」的分界线是凌晨 4 点，不是 0 点。
   也就是说凌晨 4 点之前算前一天 —— 熬夜到 2 点打卡，仍算作当天完成。 */
function dayStart(ts){
  var d = new Date(ts - DAY_OFFSET);
  d.setHours(0,0,0,0);
  return d.getTime() + DAY_OFFSET;
}
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function fmtDur(h){
  if(h < 1) return Math.round(h*60) + ' 分钟';
  if(h < 48) return (Math.round(h*10)/10) + ' 小时';
  return (Math.round(h/24*10)/10) + ' 天';
}
function mmdd(ts){ var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate(); }

/* ============ 周期待办：惰性结算 ============ */
function settle(){
  var now = Date.now();
  var today = dayStart(now);
  var changed = false;

  db.todos.forEach(function(t){
    if(t.deleted || !t.recurring || t.recurring === 'someday') return;

    var anchor = t.lastResetAt || t.createdAt || now;
    var due = false;

    if(t.recurring === 'daily'){
      due = today > dayStart(anchor);          // 跨过凌晨 4 点即刷新
    }else if(t.recurring === 'interval'){
      var n = intervalOf(t);
      var passed = Math.round((today - dayStart(anchor)) / DAY);   // 按「天」计，同样以 4 点为界
      due = passed >= n;
    }
    if(!due) return;

    if(t.done){ t.done = false; t.doneAt = null; }
    t.lastResetAt = now;
    logEvent('reset', t);
    changed = true;
  });

  if(changed) save();
  return changed;
}

/* ============ 文案 ============ */
function recurText(t){
  if(!isRecur(t)) return null;
  if(t.recurring === 'daily') return '每天刷新';
  if(t.recurring === 'interval') return '每 ' + intervalOf(t) + ' 天刷新';
  return '长期';
}

/* 把毫秒差格式化成「到小时」的倒计时 */
function countdown(ms){
  var m = Math.floor(ms / 60000);
  if(m < 1)  return '不到 1 分钟';
  if(m < 60) return m + ' 分钟';
  var h = Math.floor(m / 60);
  if(h < 24) return h + ' 小时';
  var d = Math.floor(h / 24), rh = h % 24;
  return d + ' 天' + (rh ? ' ' + rh + ' 小时' : '');
}

/* 距离下一次刷新还有多久。日度与周期都显示，不再只限于已完成状态 */
function refreshCountdown(t){
  if(!isRecur(t) || t.recurring === 'someday') return null;
  var now = Date.now(), next;
  if(t.recurring === 'daily'){
    next = dayStart(now) + DAY;                    // 下一个凌晨 4 点
  }else{
    var n = intervalOf(t);
    next = dayStart(t.lastResetAt || t.createdAt || now) + n * DAY;
    while(next <= now) next += n * DAY;            // 兜底：万一结算还没跑
  }
  var left = next - now;
  if(left <= 0) return '即将刷新';
  return '还剩 ' + countdown(left);
}

/* 截止倒计时。截止时间精确到分钟，逾期判定直接调 isOverdue，
   与统计里的 overdue 用同一个函数，不会出现两边说法不一致。 */
function dueText(t){
  if(!t.dueAt || isRecur(t)) return null;
  var now    = Date.now();
  var today  = dayStart(now);
  var dueDay = dayStart(t.dueAt);
  var diff   = Math.round((dueDay - today) / DAY);
  var day    = diff === 0 ? '今天' : diff === 1 ? '明天' : mmdd(t.dueAt);
  var dt     = new Date(t.dueAt);
  var hm     = p2(dt.getHours()) + ':' + p2(dt.getMinutes());
  var left   = t.dueAt - now;

  if(t.done) return { label:'⏰ ' + day + ' ' + hm, cls:'' };   // 已完成只留时间，倒计时没意义

  if(left <= 0){
    var over = -left;
    return { label: over < 60000 ? '⏰ 已逾期' : '⏰ 已逾期 ' + countdown(over), cls:'over' };
  }
  return {
    label: '⏰ ' + day + ' ' + hm + ' · 还剩 ' + countdown(left),
    cls: left <= DAY ? 'soon' : ''
  };
}

/* ============ 渲染：条目 ============ */
function itemHTML(t){
  /* id 正常已由 normalizeIds 规范成安全形状；这里再兜一道，防止未来某条
     绕过迁移的路径把非法 id 直接塞进属性。 */
  var safeId = /^[A-Za-z0-9_-]{1,64}$/.test(String(t.id)) ? t.id : '';
  var metas = [];

  var d = dueText(t);
  if(d) metas.push('<span class="'+d.cls+'">'+esc(d.label)+'</span>');
  if(autoUpgraded(t)) metas.push('<span class="auto">⚡ 自动紧急</span>');

  var r = recurText(t);
  if(r){
    var cd = refreshCountdown(t);
    metas.push('<span>'+esc(cd ? r + ' · ' + cd : r)+'</span>');
  }

  var meta = metas.length ? '<div class="meta">'+metas.join('')+'</div>' : '';

  return '<div class="item'+(t.done?' done':'')+'" data-id="'+safeId+'">'
       +   '<button class="check" data-act="toggle" aria-label="切换完成"></button>'
       +   '<div class="body" data-act="edit">'
       +     '<div class="txt">'+esc(t.content)+'</div>'
       +     meta
       +   '</div>'
       + '</div>';
}

/* 一个事件一行：名字 + 累计次数 + 今天次数 + 加号。

         + p2(d.getHours()) + ':' + p2(d.getMinutes())

/* ============================================================
   数据统计
   ============================================================ */

/* 按「条目 + 逻辑天」去重后的完成记录。
   勾了又取消再勾，只应算一次完成 —— 否则统计会被手滑放大。 */
function doneSet(events){
  var seen = {}, out = [];
  events.forEach(function(e){
    if(e.type !== 'done') return;
    var day = dayStart(e.at);
    var key = e.id + '@' + day;
    if(seen[key]) return;
    seen[key] = 1;
    out.push({ id:e.id, day:day, q:e.q, recur:e.recur, at:e.at });
  });
  return out;
}

/* 按天分桶：每天的 新增 / 完成 / 完成象限构成 */
function dailyBuckets(days){
  var today = dayStart(Date.now());
  var out = [], idx = {};
  for(var i = days-1; i >= 0; i--){
    var start = today - i*DAY;
    var b = { start:start, created:0, done:0, doneQ:[0,0,0,0], createdQ:[0,0,0,0] };
    out.push(b);
    idx[start] = b;
  }
  var ev = (db.log||[]).filter(function(e){ return !e.recur; });

  // 新建：按事件计 —— 同一天建两条是两件事
  ev.forEach(function(e){
    if(e.type !== 'create') return;
    var b = idx[dayStart(e.at)];
    if(!b) return;
    b.created++;
    if(e.q != null) b.createdQ[e.q]++;
  });

  // 完成：按「条目 + 天」去重 —— 勾了又取消再勾只算一次
  doneSet(ev).forEach(function(d){
    var b = idx[d.day];
    if(!b) return;
    b.done++;
    if(d.q != null && d.q >= 0 && d.q < 4) b.doneQ[d.q]++;
  });

  return out;
}

/* 习惯（周期待办）按天分桶：每天完成了几个「不同的」习惯 */
function habitBuckets(days){
  var today = dayStart(Date.now());
  var out = [], idx = {};
  for(var i = days-1; i >= 0; i--){
    var start = today - i*DAY;
    var b = { start:start, done:0 };
    out.push(b); idx[start] = b;
  }
  // doneSet 已按「条目 + 天」去重，所以每天计数天然等于「当天完成的习惯个数」
  doneSet((db.log||[]).filter(function(e){ return !!e.recur; })).forEach(function(d){
    var b = idx[d.day];
    if(b) b.done++;
  });
  return out;
}

/* 某个习惯的「当前连续」与「历史最长连续」天数 */
function streaks(id, doneByDay){
  var days = [];
  for(var k in doneByDay){ if(doneByDay[k][id]) days.push(parseInt(k,10)); }
  days.sort(function(a,b){ return a-b; });
  if(!days.length) return { cur:0, best:0 };

  var best = 1, run = 1, i;
  for(i = 1; i < days.length; i++){
    if(days[i] - days[i-1] === DAY) run++; else run = 1;
    if(run > best) best = run;
  }
  // 当前连续：今天还没打卡不算断（这一天还没过完）
  var today = dayStart(Date.now());
  var last = days[days.length-1];
  var cur = 0;
  if(last === today || last === today - DAY){
    cur = 1;
    for(i = days.length-1; i > 0; i--){
      if(days[i] - days[i-1] === DAY) cur++; else break;
    }
  }
  return { cur:cur, best:best };
}

/* 习惯维度的全部指标（与事项统计完全分开） */
function habitStats(days, today, now){
  var h = {};
  var habits  = active().filter(function(t){ return isRecur(t) && t.recurring !== 'someday'; });
  var daily   = habits.filter(function(t){ return t.recurring === 'daily'; });
  var someday = active().filter(function(t){ return t.recurring === 'someday'; });

  h.total = habits.length;
  h.dailyCount = daily.length;
  h.somedayCount = someday.length;

  /* 今日打卡：实时状态，不是日志 */
  h.todayTotal = habits.length;
  h.todayDone  = habits.filter(function(t){ return t.done; }).length;
  h.todayDailyTotal = daily.length;
  h.todayDailyDone  = daily.filter(function(t){ return t.done; }).length;

  /* 每个「天 -> 完成了哪些习惯」，用于连击 */
  var doneByDay = {};
  (db.log||[]).forEach(function(e){
    if(e.type !== 'done' || !e.recur) return;
    var d = dayStart(e.at);
    if(!doneByDay[d]) doneByDay[d] = {};
    doneByDay[d][e.id] = 1;
  });

  /* 逐条：应完成 / 实际完成 / 连击 */
  h.items = habits.map(function(t){
    // 按「逻辑天」计（凌晨 4 点为界），与刷新口径保持一致
    var spanDays = Math.max(0, Math.round((today - dayStart(t.createdAt || now)) / DAY));
    var n = Math.max(1, parseInt(t.intervalDays, 10) || 1);
    // 日度：存在几天就该做几次；周期：还没到第一个周期时记 0，不算欠账
    var expect = t.recurring === 'daily'
      ? Math.max(1, spanDays + 1)
      : Math.floor(spanDays / n);
    // 完成次数取自待办自身的计数器，不受日志裁剪影响
    var did = (t.doneCount != null)
      ? t.doneCount
      : doneSet((db.log||[]).filter(function(e){ return e.id === t.id; })).length;
    var st = streaks(t.id, doneByDay);
    /* 顺序很重要：先用「日志可见最长」把观测值记下来，再去调整对外显示的 best。
       反过来（先调整再观测）会把「真实最长」覆盖成调整后的值，越统计越大。 */
    var off = (typeof t.streakOffset === 'number' && t.streakOffset > 0) ? t.streakOffset : 0;
    /* 首次遇到「日志可见最长 > 已完成次数」这个矛盾，说明这份数据在日志被裁剪
       之前就存在：两者之差就是被裁掉的历史。 */
    if(!off && st.best > did){
      off = st.best - did;
      t.streakOffset = off;
    }
    t.streakSeen    = st.best;        // 观测：日志可见的最长连击
    t.streakVisible = st.best;        // 观测：同上，供 computeStats 反推补偿量
    if(off){
      st.best = st.best + off;
      st.cur  = Math.min(st.cur, st.best);
    }
    return {
      content:t.content, recurring:t.recurring, intervalDays:t.intervalDays,
      expect:expect, did:did,
      rate: expect ? Math.min(1, did / expect) : null,
      cur:st.cur, best:st.best
    };
  }).sort(function(a,b){
    if(a.rate === null) return 1;        // 还没到期的排最后
    if(b.rate === null) return -1;
    return a.rate - b.rate;
  });

  /* 窗口内「所有日度待办都完成」的最长连续天数 */
  h.streakAll = 0;
  if(daily.length){
    var need = daily.length, run = 0;
    for(var j = days-1; j >= 0; j--){          // 从最早的一天走到今天
      var dd = today - j*DAY;
      var cnt = 0;
      daily.forEach(function(t){ if(doneByDay[dd] && doneByDay[dd][t.id]) cnt++; });
      if(cnt >= need){ run++; if(run > h.streakAll) h.streakAll = run; }
      else run = 0;
    }
  }
  return h;
}

/* 汇总所有指标 */
function computeStats(days){
  var today = dayStart(Date.now());
  var from  = today - (days-1)*DAY;
  var now   = Date.now();
  var todos = active();

  var s = { days:days, from:from, buckets:dailyBuckets(days), habitDays:habitBuckets(days) };

  /* --- 事项（四象限待办）：当前状态 --- */
  var pendingTodo = todos.filter(function(t){ return !isRecur(t) && !t.done; });
  var doneTodo    = todos.filter(function(t){ return !isRecur(t) &&  t.done; });
  s.quadTotal  = pendingTodo.length;

  s.overdue = pendingTodo.filter(isOverdue).length;
  s.overdueRate = pct(s.overdue, s.quadTotal);

  s.quadPending = [0,0,0,0];
  pendingTodo.forEach(function(t){ s.quadPending[quadOf(t)]++; });

  /* --- 窗口内事件：事项与习惯分开取 --- */
  var evAll = (db.log||[]).filter(function(e){ return e.at >= from; });
  var ev    = evAll.filter(function(e){ return !e.recur; });
  s.created = ev.filter(function(e){ return e.type==='create'; }).length;
  var doneEv = doneSet(ev);                    // 已按「条目 + 天」去重
  s.completed = doneEv.length;
  s.net = s.created - s.completed;
  s.ratio = s.created ? Math.round(s.completed / s.created * 100) : (s.completed ? 999 : 0);

  s.todayDone = 0; s.todayCreated = 0;
  s.buckets.forEach(function(b){ if(b.start === today){ s.todayDone = b.done; s.todayCreated = b.created; } });

  /* --- 重要不紧急占比趋势（按当日完成数） --- */
  s.qeSeries = s.buckets.map(function(b){
    var tot = b.done;
    return { start:b.start, value: tot ? b.doneQ[2]/tot : null, total:tot };
  });
  /* 窗口内完成数的象限构成 */
  s.doneQ = [0,0,0,0];
  doneEv.forEach(function(d){ if(d.q != null && d.q >= 0 && d.q < 4) s.doneQ[d.q]++; });
  s.qeShare = pct(s.doneQ[2], doneEv.length);

  /* --- 平均完成周期（按象限，只看非重复待办） --- */
  s.durByQuad = [null,null,null,null];
  var acc = [[],[],[],[]];
  doneTodo.forEach(function(t){
    if(!t.doneAt) return;
    var base = t.createdAt || t.doneAt;
    var h = (t.doneAt - base) / 3600000;
    if(h < 0) return;
    acc[quadOf(t)].push(h);
  });
  acc.forEach(function(a,i){
    if(a.length) s.durByQuad[i] = { avg: a.reduce(function(x,y){return x+y;},0)/a.length, n:a.length };
  });

  /* --- 完成时段分布 --- */
  s.hours = new Array(24).fill(0);
  doneEv.forEach(function(d){ s.hours[new Date(d.at).getHours()]++; });
  var bestHour = 0;
  s.hours.forEach(function(v,i){ if(v > s.hours[bestHour]) bestHour = i; });
  s.bestHour = s.hours[bestHour] ? bestHour : null;

  /* --- 习惯（周期待办）：完全独立的一套指标 --- */
  s.habit = habitStats(days, today, now);

  /* 把「已被日志裁掉的历史」补进持久化补偿量：
       真实最长 best = 日志可见最长 st.best + streakOffset
     所以 offset 只应增加 (best - st.best)，且只增不减。
     放在这里而不是启动流程，是为了避免「纯打开应用」就写盘。 */
  var streakDirty = false;
  db.todos.forEach(function(t){
    if(!t || typeof t.streakSeen !== 'number') return;
    var off  = (typeof t.streakOffset === 'number' && t.streakOffset > 0) ? t.streakOffset : 0;
    /* 真实最长 = streakSeen；日志可见最长 = streakVisible；
       被裁掉的历史 = 两者之差。offset 只增不减，所以等价于取历史最大值。 */
    var want = t.streakSeen - ((typeof t.streakVisible === 'number') ? t.streakVisible : 0);
    if(want > off){ t.streakOffset = want; streakDirty = true; }
    delete t.streakSeen;
    delete t.streakVisible;
  });
  if(streakDirty && typeof save === 'function') save();

  /* --- 趋势文字 --- */
  s.trend = trendWord(s);

  /* --- 事件：与事项、习惯并列的第三套指标 --- */
  s.event = eventStats(days, today, now);

  return s;
}

/* ============================================================
   事件统计
   ============================================================ */
/* 事件只累计次数，所以有意义的指标是「频率」和「节奏」：
   做了多少次、多久做一次、什么时候做、哪个在涨。
   与事项/习惯完全分开，绝不混进口径。 */
function eventStats(days, today, now){
  var from = today - (days - 1) * DAY;
  var evs = activeEvents();
  var out = { days:days, total:0, allTime:0, activeDays:0, perDay:0, perWeek:0,
              bestDay:null, topEvent:null, rising:null, rest:null,
              buziest:null, hours:new Array(24).fill(0), dayDone:{}, items:[], all:[], span:null };

  /* 日志按 id 归集。注意：count 是累计真值，日志只用来算「窗口内」的节奏 */
  var byId = {}, dayset = {};
  (db.log || []).forEach(function(e){
    if(e.type !== 'bump') return;
    if(!byId[e.id]) byId[e.id] = [];
    byId[e.id].push(e.at);
    var d = dayStart(e.at);
    dayset[d] = (dayset[d] || 0) + 1;
    if(e.at >= from){
      out.total++;
      out.dayDone[d] = (out.dayDone[d] || 0) + 1;
      out.hours[new Date(e.at).getHours()]++;
    }
  });

  /* 全部事件（含已删）的累计次数 —— 这是不会被日志裁剪影响的总量 */
  (db.events || []).forEach(function(e){
    if(e && typeof e.count === 'number') out.allTime += e.count;
  });

  var dayList = Object.keys(dayset).map(Number).filter(function(d){ return d >= from; });
  out.activeDays = dayList.length;
  out.perDay  = days ? Math.round(out.total / days * 100) / 100 : 0;
  out.perWeek = Math.round(out.perDay * 7 * 10) / 10;

  /* 最多的一天 / 半小时段 */
  dayList.forEach(function(d){ if(!out.bestDay || dayset[d] > out.bestDay.n) out.bestDay = { day:d, n:dayset[d] }; });
  (function(){
    /* 用两小时为一段，比单小时更稳（事件不像待办那样扎堆在一个小时内） */
    var segs = [], i;
    for(i = 0; i < 12; i++){
      var n = out.hours[i*2] + out.hours[i*2+1];
      segs.push({ from:i*2, n:n });
    }
    var best = segs[0];
    segs.forEach(function(sg){ if(sg.n > best.n) best = sg; });
    out.buziest = best.n ? best : null;
  })();

  /* 逐事件：窗口内次数 / 距今多久没做 / 近半程 vs 前半程 */
  var mid = Math.floor(days / 2);
  out.items = evs.map(function(e){
    var arr = (byId[e.id] || []).slice().sort(function(a,b){ return a-b; });
    var inWin = arr.filter(function(at){ return at >= from; });
    var last  = arr.length ? arr[arr.length-1] : null;
    var first = arr.length ? arr[0] : null;
    var half  = today - mid * DAY;
    var older = inWin.filter(function(at){ return at <  half; }).length;
    var newer = inWin.filter(function(at){ return at >= half; }).length;
    return {
      id: e.id, name: e.name,
      total: (typeof e.count === 'number') ? e.count : 0,
      n: inWin.length,
      last: last,
      restDays: last ? Math.floor((today - dayStart(last)) / DAY) : null,
      spanDays: (first !== null && last !== null) ? Math.max(1, Math.round((dayStart(last) - dayStart(first)) / DAY) + 1) : null,
      older: older, newer: newer,
      delta: newer - older
    };
  });

  /* 只保留有过记录的，按窗口内次数排；榜首和进步最大各挑一个 */
  var ranked = out.items.filter(function(x){ return x.n > 0; }).sort(function(a,b){ return b.n - a.n; });
  out.ranked = ranked;
  out.topEvent = ranked.length ? ranked[0] : null;
  var risers = out.items.filter(function(x){ return x.n > 0 && x.delta > 0; })
                        .sort(function(a,b){ return b.delta - a.delta; });
  out.rising = risers.length ? risers[0] : null;

  /* 最久没做的（只在有记录的事件里比，没记录的不算「荒废」） */
  var rested = out.items.filter(function(x){ return x.last !== null; })
                        .sort(function(a,b){ return (b.restDays||0) - (a.restDays||0); });
  out.rest = (rested.length && rested[0].restDays > 0) ? rested[0] : null;

  /* 最近 5 次记录，给一个「流水」看 */
  var all = [];
  Object.keys(byId).forEach(function(id){
    var e = findEvent(id);
    if(!e || e.deleted) return;
    byId[id].forEach(function(at){ all.push({ at:at, name:e.name, id:id }); });
  });
  all.sort(function(a,b){ return b.at - a.at; });
  out.recent = all.slice(0, 5);
  out.all = all;
  out.span = all.length ? { first: all[all.length-1].at, last: all[0].at } : null;

  return out;
}

/* 对比「前半段 vs 后半段」，给出一句话趋势判断 */
function trendWord(s){
  var b = s.buckets;
  if(b.length < 4) return null;
  var mid = Math.floor(b.length/2);
  function sum(arr, k){ return arr.reduce(function(a,x){ return a + (k ? x[k] : x); }, 0); }
  var fDone = sum(b.slice(0,mid), 'done'), lDone = sum(b.slice(mid), 'done');
  var fCrt  = sum(b.slice(0,mid), 'created'), lCrt = sum(b.slice(mid), 'created');
  var out = [];
  if(fDone || lDone){
    var dd = lDone - fDone;
    out.push('完成量' + (dd > 0 ? '上升 ' : dd < 0 ? '下降 ' : '持平 ') +
      (fDone ? Math.abs(Math.round(dd/fDone*100)) + '%' : ''));
  }
  if(fCrt || lCrt){
    var dc = lCrt - fCrt;
    out.push('新增' + (dc > 0 ? '上升 ' : dc < 0 ? '下降 ' : '持平 ') +
      (fCrt ? Math.abs(Math.round(dc/fCrt*100)) + '%' : ''));
  }
  return out.length ? out.join('，') + '（前后半程对比）' : null;
}

/* ---- 图表 ---- */
function stackedChart(buckets, key, w, h){
  var max = 1;
  buckets.forEach(function(b){
    var t = key(b).reduce(function(a,c){ return a+c; }, 0);
    if(t > max) max = t;
  });
  var n = buckets.length;
  var gap = n > 45 ? 1 : (n > 20 ? 1.5 : 3);
  var bw = (w - (n-1)*gap) / n;
  var parts = [];
  buckets.forEach(function(b, i){
    var vals = key(b);
    var x = i*(bw+gap);
    var y = h;
    for(var qi=0; qi<4; qi++){
      var v = vals[qi];
      if(!v) continue;
      var bh = (v/max) * h;
      y -= bh;
      parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(0.6,bw).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+QCOLORS[qi]+'"/>');
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart" preserveAspectRatio="none">'+parts.join('')+'</svg>';
}
function lineChart(series, w, h, color){
  var pts = [], area = [];
  var n = series.length;
  series.forEach(function(p, i){
    if(p.value === null) return;
    var x = n > 1 ? i*(w/(n-1)) : w/2;
    var y = h - Math.max(0, Math.min(1, p.value)) * h;
    pts.push(x.toFixed(1)+','+y.toFixed(1));
    area.push([x, y]);
  });
  if(!pts.length) return '';
  var d = 'M' + pts.join(' L');
  var fill = '';
  if(area.length > 1){
    fill = '<path d="M'+area[0][0].toFixed(1)+','+h+' L'+pts.join(' L')+' L'+area[area.length-1][0].toFixed(1)+','+h+' Z" fill="'+color+'" opacity="0.12"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart" preserveAspectRatio="none">'+fill
       + '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function axisLabels(buckets, w){
  var n = buckets.length;
  if(!n) return '';
  var marks = n <= 8 ? buckets.map(function(b){ return mmdd(b.start); })
                     : [mmdd(buckets[0].start), mmdd(buckets[Math.floor(n/2)].start), mmdd(buckets[n-1].start)];
  return '<div class="axis">' + marks.map(function(m){ return '<span>'+esc(m)+'</span>'; }).join('') + '</div>';
}

/* ---- 卡片 ---- */
function cardOverview(s){
  var ratioTxt = s.created ? (s.ratio + '%') : (s.completed ? '∞' : '—');
  return '<div class="tiles">'
    + '<div class="tile"><div class="v">'+s.quadTotal+'</div><div class="k">未完成事项</div></div>'
    + '<div class="tile'+(s.overdue?' warn':'')+'"><div class="v">'+s.overdue+'</div><div class="k">已逾期</div></div>'
    + '<div class="tile'+(s.overdueRate>0?' warn':'')+'"><div class="v">'+s.overdueRate+'%</div><div class="k">逾期率</div></div>'
    + '<div class="tile"><div class="v">'+s.todayDone+'</div><div class="k">今日完成</div></div>'
    + '<div class="tile"><div class="v">'+s.todayCreated+'</div><div class="k">今日新增</div></div>'
    + '<div class="tile"><div class="v">'+ratioTxt+'</div><div class="k">完成/新增</div></div>'
    + '</div>'
    + '<div class="hint" style="margin:-2px 14px 0">以上只统计<b>四象限待办</b>。周期待办的指标在下方「习惯统计」。</div>';
}

function cardQuadrant(s){
  var rows = '';
  for(var q=0;q<4;q++){
    var n = s.quadPending[q];
    var p = pct(n, s.quadTotal);
    rows += '<div class="hbar">'
         +  '<span class="lb">'+SHORT_Q[q]+'</span>'
         +  '<span class="track"><span class="fill" style="width:'+p+'%;background:'+QCOLORS[q]+'"></span></span>'
         +  '<span class="num">'+n+' · '+p+'%</span>'
         +  '</div>';
  }
  return '<div class="card"><h3>四象限分布<span class="sub">仅四象限待办 · '+s.quadTotal+' 条</span></h3>'
       + (s.quadTotal ? rows
            : '<div class="empty-stat">当前没有未完成的四象限待办。<br>新建几条，这里就会显示精力分布。</div>')
       + '<div class="hint">理想状态是「重要不紧急」占多数。如果「重要且紧急」长期爆满，说明你在持续救火，缺少提前规划。</div>'
       + '</div>';
}

function cardDoneTrend(s){
  var w = 320, h = 90;
  var chart = stackedChart(s.buckets, function(b){ return b.doneQ; }, w, h);
  var any = s.buckets.some(function(b){ return b.done > 0; });
  var body = any ? chart + axisLabels(s.buckets, w)
    : '<div class="empty-stat">这段时间还没有完成记录</div>';
  return '<div class="card"><h3>完成趋势<span class="sub">按象限堆叠 · 每日完成数</span></h3>'
       + body
       + '<div class="legend">'
       +   QCOLORS.map(function(c,i){ return '<span><i style="background:'+c+'"></i>'+SHORT_Q[i]+'</span>'; }).join('')
       + '</div></div>';
}

function cardQE(s){
  var w = 320, h = 70;
  var series = s.qeSeries;
  var any = series.some(function(p){ return p.value !== null; });
  var chart = any ? lineChart(series, w, h, QCOLORS[2]) + axisLabels(s.buckets, w) : '';

  var note = s.qeShare >= 40
    ? '很好：完成的事项里有相当比例是「重要不紧急」，说明你在做有长期价值的事。'
    : s.qeShare >= 20
      ? '一般：有一部分精力投在长期价值上，可以再往上提。'
      : '偏低：完成的事项几乎都是火烧眉毛的，考虑每天固定留一段时间给「重要不紧急」。';

  return '<div class="card"><h3>重要不紧急占比趋势<span class="sub">最能反映规划能力</span></h3>'
       + (any ? chart : '<div class="empty-stat">这段时间还没有完成记录</div>')
       + (any ? '<div class="hint">窗口内平均 <b>'+s.qeShare+'%</b> 的完成事项属于「重要不紧急」。'+note+'</div>' : '')
       + '</div>';
}

function cardFlow(s){
  var w = 320, h = 80;
  var created = s.buckets.map(function(b){ return b.created; });
  var done    = s.buckets.map(function(b){ return b.done; });
  var max = 1;
  created.concat(done).forEach(function(v){ if(v>max) max=v; });
  var n = s.buckets.length;
  var gap = n > 45 ? 1 : (n > 20 ? 1.5 : 3);
  var bw = (w - (n-1)*gap) / n;
  var parts = [];
  for(var i=0;i<n;i++){
    var x = i*(bw+gap);
    var hc = created[i]/max*h, hd = done[i]/max*h;
    if(created[i]) parts.push('<rect x="'+(x+bw*0.42).toFixed(1)+'" y="'+(h-hc).toFixed(1)+'" width="'+(bw*0.55).toFixed(1)+'" height="'+hc.toFixed(1)+'" fill="'+QCOLORS[3]+'" rx="1"/>');
    if(done[i])    parts.push('<rect x="'+x.toFixed(1)+'" y="'+(h-hd).toFixed(1)+'" width="'+(bw*0.55).toFixed(1)+'" height="'+hd.toFixed(1)+'" fill="var(--accent)" rx="1"/>');
  }
  var chart = '<svg viewBox="0 0 '+w+' '+h+'" class="chart" preserveAspectRatio="none">'+parts.join('')+'</svg>';
  var any = s.buckets.some(function(b){ return b.created || b.done; });

  var verdict = s.net > 0
    ? '待办在堆积：窗口内新增比完成多 <b>'+s.net+'</b> 条。'
    : s.net < 0
      ? '在清旧账：窗口内完成比新增多 <b>'+(-s.net)+'</b> 条。'
      : '进出平衡：新增与完成持平。';

  /* 新增为 0 时比值没有意义（s.ratio 是 999 哨兵），要跟概览 tile 一样显示 ∞，
     不能把哨兵数字直接打出来。 */
  var ratioTxt = s.created ? (s.ratio + '%') : (s.completed ? '∞' : '—');

  return '<div class="card"><h3>新增 vs 完成<span class="sub">看净流入</span></h3>'
       + (any ? chart + axisLabels(s.buckets, w) : '<div class="empty-stat">这段时间还没有记录</div>')
       + '<div class="legend"><span><i style="background:var(--accent)"></i>完成 '+s.completed+'</span>'
       +   '<span><i style="background:'+QCOLORS[3]+'"></i>新增 '+s.created+'</span></div>'
       + (any ? '<div class="hint">'+verdict+' 完成/新增 比 = <b>'+ratioTxt+'</b>（超过 100% 说明在消化历史欠账）。</div>' : '')
       + '</div>';
}

function cardDuration(s){
  var rows = '';
  var max = 0;
  s.durByQuad.forEach(function(d){ if(d && d.avg > max) max = d.avg; });
  var found = s.durByQuad.some(function(d){ return !!d; });
  if(!found){
    return '<div class="card"><h3>平均完成周期<span class="sub">从创建到完成 · 按象限</span></h3>'
         + '<div class="empty-stat">还没有已完成的非重复待办。<br>完成几条之后，这里会告诉你各类事要拖多久。</div>'
         + '<div class="hint">对比「重要且紧急」和「重要不紧急」：前者明显更快是正常的；如果后者拖得特别久，说明长期事项一直被压后。</div></div>';
  }
  for(var q=0;q<4;q++){
    var d = s.durByQuad[q];
    if(!d) { rows += '<div class="hbar"><span class="lb">'+SHORT_Q[q]+'</span><span class="track"></span><span class="num">—</span></div>'; continue; }
    var p = max ? Math.round(d.avg/max*100) : 0;
    rows += '<div class="hbar"><span class="lb">'+SHORT_Q[q]+'</span>'
         +  '<span class="track"><span class="fill" style="width:'+p+'%;background:'+QCOLORS[q]+'"></span></span>'
         +  '<span class="num">'+fmtDur(d.avg)+'</span></div>';
  }
  return '<div class="card"><h3>平均完成周期<span class="sub">从创建到完成 · 按象限</span></h3>'
       + rows
       + '<div class="hint">对比「重要且紧急」和「重要不紧急」：前者明显更快是正常的；如果后者拖得特别久，说明长期事项一直被压后。</div></div>';
}

function cardHours(s){
  var max = Math.max.apply(null, s.hours.concat([1]));
  var bars = s.hours.map(function(v){
    var h = v ? Math.max(3, Math.round(v/max*66)) : 3;
    return '<div style="height:'+h+'px;opacity:'+(v?0.9:0.25)+'"></div>';
  }).join('');
  var any = s.hours.some(function(v){ return v>0; });
  return '<div class="card"><h3>完成时段分布<span class="sub">你什么时候最能干成事</span></h3>'
       + '<div class="hours">'+bars+'</div>'
       + '<div class="axis"><span>0点</span><span>6点</span><span>12点</span><span>18点</span><span>23点</span></div>'
       + (any ? '<div class="hint">你的高效时段在 <b>'+s.bestHour+' 点</b> 前后。把最难的事排到这里，比硬扛有效。</div>'
              : '<div class="hint">这段时间还没有完成记录。</div>')
       + '</div>';
}

function cardHabitToday(s){
  var h = s.habit;
  if(!h.total){
    return '<div class="card"><h3>今日打卡</h3>'
         + '<div class="empty-stat">还没有周期待办。<br>到「周期待办」页新建，这里就会开始统计。</div></div>';
  }
  var p = pct(h.todayDone, h.todayTotal);
  var word = p >= 100 ? '今天全部完成 🎉' : p >= 50 ? '过半了，保持' : '今天才刚开始';
  return '<div class="card"><h3>今日打卡<span class="sub">'+h.todayDone+' / '+h.todayTotal+' 条</span></h3>'
       + '<div class="hbar" style="margin:0"><span class="track" style="height:20px">'
       + '<span class="fill" style="width:'+p+'%;background:var(--accent)"></span></span></div>'
       + '<div class="hint">'+word+'。其中日度待办 '+h.todayDailyDone+' / '+h.todayDailyTotal+' 条。'
       + (h.somedayCount ? '另有 '+h.somedayCount+' 条长期待办。' : '') + '</div></div>';
}

function cardHabitHeat(s){
  var days = s.habitDays;
  var max = 1;
  days.forEach(function(d){ if(d.done > max) max = d.done; });
  var cells = days.map(function(d){
    var bg = d.done
      ? 'rgba(10,132,255,' + (0.28 + 0.72 * (d.done / max)).toFixed(2) + ')'
      : 'var(--line)';
    return '<span class="hcell" style="background:'+bg+'"></span>';
  }).join('');
  var total = days.reduce(function(a,d){ return a + d.done; }, 0);
  var activeDays = days.filter(function(d){ return d.done > 0; }).length;
  return '<div class="card"><h3>打卡热力图<span class="sub">越深 = 当天完成的习惯越多</span></h3>'
       + '<div class="heat">'+cells+'</div>'
       + '<div class="hint">这 '+days.length+' 天里有 <b>'+activeDays+'</b> 天打过卡，累计完成 <b>'+total+'</b> 次。'
       + (activeDays === 0 ? '还没有习惯记录，今天开始打第一个卡吧。' : '') + '</div></div>';
}

function cardRecur(s){
  var h = s.habit;
  if(!h.items.length){
    return '<div class="card"><h3>习惯稳定度</h3>'
         + '<div class="empty-stat">还没有日度或周期待办。<br>新建后这里会统计你有没有坚持住。</div></div>';
  }
  var rows = h.items.map(function(r){
    var notDue = (r.rate === null);            // 周期项还没到第一个周期
    var p = notDue ? 0 : Math.round(r.rate * 100);
    var col = notDue ? QCOLORS[3] : (p >= 80 ? QCOLORS[2] : p >= 50 ? QCOLORS[1] : QCOLORS[0]);
    var detail = r.recurring === 'daily'
      ? '每天 · 当前连续 <b>'+r.cur+'</b> 天 · 最长 <b>'+r.best+'</b> 天'
      : '每 ' + r.intervalDays + ' 天';
    var right = notDue
      ? '还没到期 · 已完成 ' + r.did + ' 次'
      : (r.did + ' / ' + r.expect + ' 次 · ' + p + '%');
    return '<div class="rstab">'
         +  '<div class="top"><span class="nm">'+esc(r.content)+'</span>'
         +  '<span class="pct">'+right+'</span></div>'
         +  '<span class="track" style="display:block;height:13px;background:var(--bg);border-radius:7px;overflow:hidden">'
         +  '<span class="fill" style="display:block;height:100%;width:'+p+'%;background:'+col+';border-radius:7px"></span></span>'
         +  '<div class="hint" style="margin-top:5px">'+detail+'</div>'
         +  '</div>';
  }).join('');
  var streakLine = h.streakAll > 0
    ? '窗口内最长连续 <b>'+h.streakAll+'</b> 天把所有日度待办都完成了。'
    : '窗口内还没有出现过「当天所有日度待办都完成」的连续记录。';
  return '<div class="card"><h3>习惯稳定度<span class="sub">实际 / 应完成</span></h3>'
       + rows
       + '<div class="hint">'+streakLine+' 完成率最低的排在最上面，优先看它们。</div></div>';
}

/* ---- 事件卡片 ---- */
function cardEventOverview(s){
  var e = s.event;
  if(!e.allTime && !e.total){
    return '<div class="card"><h3>事件概览</h3>'
         + '<div class="empty-stat">还没有事件记录。<br>到「事件」页新建一个，点 ＋ 就会开始统计。</div></div>';
  }
  function tile(v, k, warn){
    return '<div class="tile'+(warn?' warn':'')+'"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>';
  }
  return '<div class="tiles">'
    + tile(e.total, '窗口内次数')
    + tile(e.allTime, '累计次数')
    + tile(e.perDay, '平均每天')
    + tile(e.perWeek, '平均每周')
    + tile(e.activeDays + '/' + s.days, '有记录的天数')
    + tile(e.items.filter(function(x){ return x.n > 0; }).length, '活跃事件')
    + '</div>'
    + '<div class="hint" style="margin:-2px 14px 0">'
    + '「累计次数」来自事件自身的计数器，不受日志裁剪影响。</div>';
}

function cardEventTrend(s){
  var e = s.event;
  var w = 320, h = 80;
  var vals = [], i;
  for(i = 0; i < s.days; i++){
    vals.push(e.dayDone[dayStart(Date.now()) - (s.days-1-i)*DAY] || 0);
  }
  var any = vals.some(function(v){ return v > 0; });
  if(!any){
    return '<div class="card"><h3>记录趋势<span class="sub">每天记了几次</span></h3>'
         + '<div class="empty-stat">这段时间还没有记录</div></div>';
  }
  var max = Math.max.apply(null, vals.concat([1]));
  var gap = s.days > 45 ? 1 : (s.days > 20 ? 1.5 : 3);
  var bw = (w - (s.days-1)*gap) / s.days;
  var parts = [];
  vals.forEach(function(v, idx){
    if(!v) return;
    var bh = v/max*h, x = idx*(bw+gap);
    parts.push('<rect x="'+x.toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+Math.max(0.6,bw).toFixed(1)
      + '" height="'+bh.toFixed(1)+'" fill="var(--accent)" rx="1"/>');
  });
  var chart = '<svg viewBox="0 0 '+w+' '+h+'" class="chart" preserveAspectRatio="none">'+parts.join('')+'</svg>';

  var line = e.bestDay
    ? '最勤的一天是 <b>'+mmdd(e.bestDay.day)+'</b>，记了 <b>'+e.bestDay.n+'</b> 次。'
    : '';
  return '<div class="card"><h3>记录趋势<span class="sub">每天记了几次</span></h3>'
       + chart + axisLabels(s.buckets, w)
       + '<div class="hint">'+line+'</div></div>';
}

function cardEventRank(s){
  var e = s.event;
  var list = (e.ranked || []);
  if(!list.length){
    return '<div class="card"><h3>次数排行<span class="sub">窗口内</span></h3>'
         + '<div class="empty-stat">这段时间还没有记录</div></div>';
  }
  var max = list[0].n || 1;
  var rows = list.map(function(x, i){
    var p = Math.round(x.n/max*100);
    var col = i === 0 ? QCOLORS[2] : 'var(--accent)';
    return '<div class="hbar"><span class="lb">'+esc(x.name)+'</span>'
         + '<span class="track"><span class="fill" style="width:'+p+'%;background:'+col+'"></span></span>'
         + '<span class="num">'+x.n+' 次</span></div>';
  }).join('');
  var top = e.topEvent
    ? '窗口内 <b>'+esc(e.topEvent.name)+'</b> 最多，占 ' + pct(e.topEvent.n, e.total) + '%。'
    : '';
  var rise = e.rising
    ? ' 涨得最快的是 <b>'+esc(e.rising.name)+'</b>（后半程比前半程多 '+e.rising.delta+' 次）。'
    : '';
  return '<div class="card"><h3>次数排行<span class="sub">窗口内 · 共 '+e.total+' 次</span></h3>'
       + rows + '<div class="hint">'+top+rise+'</div></div>';
}

function cardEventRhythm(s){
  var e = s.event;
  var bars = e.hours.map(function(v){
    var max = Math.max.apply(null, e.hours.concat([1]));
    var hh = v ? Math.max(3, Math.round(v/max*56)) : 3;
    return '<div style="height:'+hh+'px;opacity:'+(v?0.9:0.25)+'"></div>';
  }).join('');
  var any = e.hours.some(function(v){ return v > 0; });
  var bz = e.buziest;
  var txt = bz ? '你最常在 <b>'+bz.from+'–'+(bz.from+2)+' 点</b> 做这件事。' : '';
  var rest = e.rest
    ? ' 最久没记的是 <b>'+esc(e.rest.name)+'</b>，已经 '+e.rest.restDays+' 天。'
    : '';
  return '<div class="card"><h3>发生时段<span class="sub">你什么时候做这件事</span></h3>'
       + '<div class="hours">'+bars+'</div>'
       + '<div class="axis"><span>0点</span><span>6点</span><span>12点</span><span>18点</span><span>23点</span></div>'
       + '<div class="hint">'+(any ? txt + rest : '这段时间还没有记录。')+'</div></div>';
}

function cardEventRecent(s){
  var e = s.event;
  var list = e.recent || [];
  if(!list.length){
    return '<div class="card"><h3>最近记录<span class="sub">最近 5 次</span></h3>'
         + '<div class="empty-stat">还没有记录</div></div>';
  }
  var rows = list.map(function(x){
    var d = new Date(x.at);
    var day = dayStart(x.at) === dayStart(Date.now()) ? '今天' : mmdd(x.at);
    return '<div class="hbar" style="margin-bottom:7px">'
         + '<span class="lb">'+esc(x.name)+'</span>'
         + '<span class="num" style="width:auto;flex:1;text-align:left;color:var(--muted)">'
         + day + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + '</span></div>';
  }).join('');
  var span = '';
  if(e.span){
    var usedDays = Math.max(1, Math.round((dayStart(e.span.last) - dayStart(e.span.first)) / DAY) + 1);
    span = '最早一次记录在 <b>'+mmdd(e.span.first)+'</b>，至今 <b>'+usedDays+'</b> 天。';
  }
  return '<div class="card"><h3>最近记录<span class="sub">最近 '+list.length+' 次</span></h3>'
       + rows + '<div class="hint">'+span+'</div></div>';
}

/* ---- 三个子页 ---- */
function renderStatsQuad(s){
  var html = cardOverview(s)
           + cardQuadrant(s) + cardDoneTrend(s) + cardQE(s)
           + cardFlow(s) + cardDuration(s) + cardHours(s);
  if(s.trend) html += '<div class="card"><h3>整体趋势<span class="sub">事项</span></h3>'
                    + '<div class="hint" style="margin:0">'+s.trend+'</div></div>';
  return html;
}
function renderStatsHabit(s){
  return cardHabitToday(s) + cardHabitHeat(s) + cardRecur(s);
}
function renderStatsEvent(s){
  return cardEventOverview(s) + cardEventTrend(s)
       + cardEventRank(s) + cardEventRhythm(s) + cardEventRecent(s);
}

function renderStats(){
  var s = computeStats(ui.days);
  var which = ui.stats || 'quad';
  var html = which === 'habit' ? renderStatsHabit(s)
           : which === 'event' ? renderStatsEvent(s)
           : renderStatsQuad(s);

  document.querySelectorAll('#segRange button').forEach(function(b){
    b.classList.toggle('on', parseInt(b.getAttribute('data-days'),10) === ui.days);
  });

    b.classList.toggle('on', b.getAttribute('data-stats') === which);
  });

/* 记下滚动位置：整块重绘会把它清空，勾选一条后列表会跳回顶部 */
var SCROLL_IDS = ['ql0','ql1','ql2','ql3','quadBody','recurScroll','eventScroll','statsBody'];
function captureScroll(){
  var o = {};
  SCROLL_IDS.forEach(function(id){
    var el = document.getElementById(id);
    if(el) o[id] = el.scrollTop;
  });
  return o;
}
function restoreScroll(o){
  SCROLL_IDS.forEach(function(id){
    var el = document.getElementById(id);
    if(el && o[id]) el.scrollTop = o[id];
  });
}

/* 底部提示条，可带一个「撤销」动作 */
var toastTimer = null;
function showToast(msg, actionLabel, onAction){
  document.getElementById('toastMsg').textContent = msg;
  var btn = document.getElementById('toastAct');
  if(actionLabel){
    btn.textContent = actionLabel;
    btn.classList.remove('hidden');
    btn.onclick = function(){ hideToast(); if(onAction) onAction(); };
  }else{
    btn.classList.add('hidden');
    btn.onclick = null;
  }
  document.getElementById('toast').classList.remove('hidden');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){
  document.getElementById('toast').classList.add('hidden');
  if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
}

      save(); closeEventEditor(); renderEvents();
      showToast('已删除「' + e.name + '」');

/* ============ 编辑器 ============ */
function openEditor(id, presetQuad, presetRecur){
  editingId = id || null;
  var t = id ? db.todos.filter(function(x){return x.id===id;})[0] : null;

  document.getElementById('editTitle').textContent = t ? '编辑待办' : '新建待办';

  if(t){
    draft.imp = !!t.important;
    draft.urg = !!t.urgent;
    draft.recur = isRecur(t) ? t.recurring : 'none';
    draft.intervalDays = Math.max(1, parseInt(t.intervalDays,10) || 3);
    document.getElementById('fContent').value = t.content || '';
    /* 必须用 toLocalInput：fDue 是 datetime-local，只给「YYYY-MM-DD」会被浏览器
       判定为非法值并置空，用户一保存就把原有截止时间清掉了。 */
    document.getElementById('fDue').value = t.dueAt ? toLocalInput(t.dueAt) : '';
    document.getElementById('fRemind').value = t.remindAt ? toLocalInput(t.remindAt) : '';
  }else{
    draft.recur = presetRecur || 'none';
    draft.intervalDays = 3;
    if(draft.recur === 'none'){
      var pq = (presetQuad === undefined || presetQuad === null) ? 0 : presetQuad;
      draft.imp = QUADS[pq].imp;
      draft.urg = QUADS[pq].urg;
    }else{
      draft.imp = true; draft.urg = true;
    }
    document.getElementById('fContent').value = '';
    document.getElementById('fDue').value = '';
    document.getElementById('fRemind').value = '';
  }

  document.getElementById('fInterval').value = draft.intervalDays;
  syncChips();
  syncRecurChips();
  document.getElementById('editDeleteRow').classList.toggle('hidden', !t);
  document.getElementById('maskEdit').classList.remove('hidden');
  if(!t) setTimeout(function(){ document.getElementById('fContent').focus(); }, 120);
}
function syncChips(){
  document.getElementById('chipImp').classList.toggle('on', draft.imp);
  document.getElementById('chipUrg').classList.toggle('on', draft.urg);

  /* 提示这条会不会被「到期自动紧急」接管 */
  var dueVal = document.getElementById('fDue').value;
  var willAuto = draft.recur === 'none' && !draft.urg && !!dueVal
              && ((new Date(dueVal).getTime() - Date.now()) <= DAY);
  document.getElementById('autoUrgHint').classList.toggle('hidden', !willAuto);
}
function syncRecurChips(){
  document.querySelectorAll('#recurChips .chip').forEach(function(c){
    c.classList.toggle('on', c.getAttribute('data-r') === draft.recur);
  });
  document.getElementById('intervalField').classList.toggle('hidden', draft.recur !== 'interval');
  document.getElementById('impUrgField').classList.toggle('hidden', draft.recur !== 'none');
}
function toDateInput(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
function toLocalInput(ts){
  var d = new Date(ts);
  return toDateInput(ts)+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
}
function p2(n){ return (n<10?'0':'')+n; }

function saveEditor(){
  var content = document.getElementById('fContent').value.trim();
  if(!content){ document.getElementById('fContent').focus(); return; }

  var dueVal = document.getElementById('fDue').value;
  var remVal = document.getElementById('fRemind').value;
  var dueAt  = dueVal ? new Date(dueVal).getTime() : null;   // datetime-local → 本地时间，精确到分钟
  var remind = remVal ? new Date(remVal).getTime() : null;

  var recur = (draft.recur === 'none') ? null : draft.recur;
  var intervalDays = (recur === 'interval')
    ? Math.max(1, Math.min(365, parseInt(document.getElementById('fInterval').value,10) || 1))
    : null;

  if(editingId){
    db.todos.forEach(function(t){
      if(t.id !== editingId) return;
      var oldRecur = t.recurring;
      t.content   = content;
      t.important = draft.imp;
      t.urgent    = draft.urg;
      t.dueAt     = dueAt;
      t.remindAt  = remind;
      t.recurring = recur;
      t.intervalDays = intervalDays;
      if(recur){
        if(oldRecur !== recur || !t.lastResetAt) t.lastResetAt = Date.now();
      }else{
        t.lastResetAt = null;
      }
    });
  }else{
    var nt = {
      id: uid(), content: content,
      createdAt: Date.now(), dueAt: dueAt, remindAt: remind,
      done: false, doneAt: null,
      important: draft.imp, urgent: draft.urg,
      deleted: false,
      recurring: recur, intervalDays: intervalDays,
      lastResetAt: recur ? Date.now() : null
    };
    db.todos.push(nt);
    logEvent('create', nt);
  }
  save(); closeEditor(); render();
}
function closeEditor(){
  document.getElementById('maskEdit').classList.add('hidden');
  editingId = null;
}

/* ============ 事件 ============ */
function findTodo(id){
  return db.todos.filter(function(t){ return t.id===id; })[0];
}
function toggleDone(id){
  var t = findTodo(id);
  if(!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  if(t.done){
    var day = dayStart(Date.now());
    if(t.lastDoneDay === null || day > t.lastDoneDay){   // 用 > 而不是 !==：系统时间回拨时不会重复计数
      t.doneCount = (t.doneCount || 0) + 1;
      t.lastDoneDay = day;
    }
  }
  logEvent(t.done ? 'done' : 'undone', t);
  save(); render();
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if(el){
    var act = el.getAttribute('data-act');
    if(act === 'toggle'){
      var it = el.closest('.item');
      if(it) toggleDone(it.getAttribute('data-id'));
      return;
    }
    if(act === 'edit'){
      var it2 = el.closest('.item');
      if(it2) openEditor(it2.getAttribute('data-id'));
      return;
    }
    if(act === 'add'){ openEditor(null, parseInt(el.getAttribute('data-q'),10)); return; }
    if(act === 'bump-event'){ bumpEvent(el.getAttribute('data-id')); return; }
    if(act === 'edit-event'){
      var it3 = el.closest('.item');
      if(it3) openEventEditor(it3.getAttribute('data-id'));
      return;
    }
    if(act === 'open'){
      ui.quad = parseInt(el.getAttribute('data-q'),10);
      document.getElementById('screenQuad').classList.remove('hidden');
      renderQuad();
      return;
    }
  }
  var cl = ev.target.closest('[data-close]');
  if(cl){
    document.getElementById(cl.getAttribute('data-close')).classList.add('hidden');
    if(cl.getAttribute('data-close') === 'screenQuad') ui.quad = null;
    return;
  }
  var tb = ev.target.closest('[data-tab]');
  if(tb){ switchTab(tb.getAttribute('data-tab')); return; }

  var sb = ev.target.closest('[data-sub]');
  if(sb){
    ui.sub = sb.getAttribute('data-sub');
    document.querySelectorAll('#segHome button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-sub') === ui.sub);
    });
    render(); return;
  }
  var rb = ev.target.closest('[data-rtype]');
  if(rb){ ui.rtype = rb.getAttribute('data-rtype'); renderRecur(); return; }

  var db2 = ev.target.closest('[data-days]');
  if(db2){ ui.days = parseInt(db2.getAttribute('data-days'),10); renderStats(); return; }

  var sb2 = ev.target.closest('[data-stats]');
  if(sb2){ ui.stats = sb2.getAttribute('data-stats'); renderStats(); return; }
});

function switchTab(tab){
  ui.tab = tab;
  settle();                      // 先结算：跨过凌晨 4 点后切页也能看到正确状态
  ['home','recur','event','stats'].forEach(function(t){
    document.getElementById('page-'+t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('#tabbar button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tab') === tab);
  });
  document.getElementById('btnRecurAdd').classList.toggle('hidden', tab !== 'recur');
  document.getElementById('btnEventAdd').classList.toggle('hidden', tab !== 'event');
  document.getElementById('pageTitle').textContent =
    tab === 'home' ? '佳木的待办助手'
    : tab === 'recur' ? '周期待办'
    : tab === 'event' ? '事件'
    : '数据统计';
  if(tab === 'recur') renderRecur();
  if(tab === 'event') renderEvents();
  if(tab === 'stats') renderStats();
}
